# Public community Worker (what the addon talks to). Template: real binding IDs
# live in wrangler.public.local.toml (git-ignored), which the deploy scripts use.
# The production name/URL must never change: shipped addons have it built in.
name = "crimson-weather-community-presets"
main = "dist/public/index.js"
no_bundle = true            # built by build.mjs
compatibility_date = "2026-05-20"
workers_dev = true

[observability]
enabled = true             # keep Worker logs (errors are logged as JSON)

[triggers]
crons = ["17 3 * * *"]      # purge expired soft-deleted presets

[vars]
CATALOG_CACHE_SECONDS = "300"
MAX_PRESET_BYTES = "65536"
MIN_ADDON_VERSION = "0.6.3"

[[d1_databases]]
binding = "DB"
database_name = "crimson-weather-community-presets"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PRESETS"
bucket_name = "crimson-weather-community-presets"

[env.dev]
observability = { enabled = true }
name = "crimson-weather-community-presets-dev"
triggers = { crons = ["23 3 * * *"] }
vars = { CATALOG_CACHE_SECONDS = "30", MAX_PRESET_BYTES = "65536", MIN_ADDON_VERSION = "0.6.3" }
d1_databases = [{ binding = "DB", database_name = "crimson-weather-community-presets-dev", database_id = "00000000-0000-0000-0000-000000000000", migrations_dir = "migrations" }]
r2_buckets = [{ binding = "PRESETS", bucket_name = "crimson-weather-community-presets-dev" }]
